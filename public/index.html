<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Killua - Drive Index</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn1QJp02ztntarNkv7-7nuzyptP39WL9Ltk6biUkzMaGpoEC56i1QJ57AG&s=10">
  <style>
    @import url(https://vsthemes.org/uploads/generator/client/BasicBackground.css);
    
    :root {
      /* Killua light blue Theme */
      --transparencycolor: 0,0,0;
      --transparencyalpha: 0.05;
      --messagetransparency: 0.5;
      --guildchanneltransparency: 0.2;
      --memberlistransparency: 0.05;
      --accentcolor: 183,233,238;
      --background: url("https://vsthemes.org/uploads/posts/2021-02/1613683009_walldump-qpaeny82y.webp");
      --backdrop: rgba(0,0,0,0.2);
      --backgroundblur: 0px;
      --popoutblur: 0px;
      --backdropblur: 0px;
      --version1_0_5:none;
      --backgroundsize: cover;
      --popoutsize: cover;
      --backdropsize: cover;

      /* UI Mapping */
      --haru-pink: rgb(var(--accentcolor));
      --haru-pink-light: rgba(var(--accentcolor), 0.7);
      --haru-pink-dark: #8fc7cc;
      --haru-bg: transparent;
      --haru-surface: rgba(var(--transparencycolor), var(--guildchanneltransparency));
      --haru-surface-hover: rgba(var(--transparencycolor), var(--messagetransparency));
      --text-dark: #ffffff;
      --text-muted: #d0d0d0;
      --border-color: rgba(255, 255, 255, 0.15);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--background) center/var(--backgroundsize) fixed;
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      max-width: 100vw;
      text-shadow: 0 1px 3px rgba(0,0,0, 0.8); /* Ensures text is readable against any background */
    }
    /* Header */
    header {
      background: var(--haru-surface);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--haru-pink-light);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0, 0.8);
    }
    .logout-btn {
      background: var(--haru-pink);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      text-shadow: none; /* Remove shadow from buttons to keep them clean */
    }
    .logout-btn:hover {
      background: var(--haru-pink-light);
      color: var(--haru-pink-dark);
    }
    /* Container */
    .container {
      max-width: 95%;
      margin: 30px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
      padding-bottom: 20px;
      margin-bottom: 40px;
    }
    /* Login Box */
    .login-box {
      background: rgba(0,0,0, 0.75);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 40px rgba(0,0,0, 0.8);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      backdrop-filter: blur(10px);
    }
    .login-box h2 {
      color: var(--haru-pink-light);
      margin-bottom: 10px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      background: rgba(0,0,0,0.2);
      border: 2px solid var(--border-color);
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 1rem;
    }
    .login-box input:focus {
      border-color: var(--haru-pink-light);
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: var(--haru-pink);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .login-box button:hover {
      background: var(--haru-pink-light);
      color: var(--haru-pink-dark);
    }
    /* File Explorer */
    .breadcrumb-bar {
      margin-bottom: 15px;
      font-weight: 600;
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      overflow-x: auto;
      box-sizing: border-box;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .breadcrumb-bar a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .breadcrumb-bar a:hover {
      color: var(--haru-pink-light);
      text-decoration: underline;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--haru-surface);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }
    .search-box {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 10px 15px;
      border-radius: 8px;
      width: 300px;
      outline: none;
      font-family: 'Inter', sans-serif;
    }
    .search-box:focus {
      border-color: var(--haru-pink-light);
    }
    .search-box::placeholder {
      color: #999;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: var(--haru-surface);
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background: var(--haru-surface-hover);
    }
    .btn-download {
      background: var(--haru-pink);
      border-color: var(--haru-pink);
      color: white;
    }
    .btn-download:hover {
      background: #e65287;
    }
    .file-list {
      background: var(--haru-surface);
      color: var(--text-dark);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      font-family: 'Inter', sans-serif;
    }
    .file-header {
      display: grid;
      grid-template-columns: 40px 40px minmax(200px, 1fr) 150px 100px 120px;
      min-width: 750px;
      padding: 15px 20px;
      background: rgba(0,0,0,0.15);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }
    .file-item {
      display: grid;
      grid-template-columns: 40px 40px minmax(200px, 1fr) 150px 100px 120px;
      min-width: 750px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      transition: background 0.2s;
    }
    .file-item:last-child {
      border-bottom: none;
    }
    .file-item:hover, .file-item.selected {
      background: var(--haru-surface-hover);
    }
    .file-footer {
      padding: 12px 20px;
      background: rgba(0,0,0,0.15);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }
    .name-col {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .file-checkbox {
      accent-color: var(--haru-pink);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .file-icon {
      font-size: 1.2rem;
    }
    .file-name {
      font-weight: 600;
      color: var(--text-dark);
      text-decoration: none;
      word-break: normal;
      overflow-wrap: break-word;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .file-name:hover {
      text-decoration: underline;
      color: var(--haru-pink-light);
    }
    .file-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .act-col {
      display: flex;
      gap: 8px;
    }
    .act-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--haru-pink-light);
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act-btn:hover {
      background: var(--haru-pink);
      color: white;
      border-color: var(--haru-pink);
    }
    /* Loading Spinner */
    .loader {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid var(--haru-pink);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 50px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .file-header, .file-item {
        padding: 12px 10px;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box {
        width: 100%;
        margin-bottom: 10px;
        box-sizing: border-box;
      }
      .actions {
        justify-content: flex-start;
        width: 100%;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="login-box">
      <div style="font-size: 2rem; font-weight: 800; color: var(--haru-pink-light); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn1QJp02ztntarNkv7-7nuzyptP39WL9Ltk6biUkzMaGpoEC56i1QJ57AG&s=10" alt="icon" style="width: 40px; height: 40px; border-radius: 50%;">
        KillDrive
      </div>
      <p>Enter your password to access KillDrive storage.</p>
      <form id="login-form">
        <input type="password" id="password-input" placeholder="Password..." autofocus required />
        <button type="submit">Access Now</button>
      </form>
    </div>

    <!-- Main Explorer Screen (Hidden Initially) -->
    <div id="explorer-screen" style="display: none; flex-direction: column; min-height: 100vh;">
      <header>
        <a href="#" class="logo">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRn1QJp02ztntarNkv7-7nuzyptP39WL9Ltk6biUkzMaGpoEC56i1QJ57AG&s=10" alt="icon" style="width: 32px; height: 32px; border-radius: 50%;">
          KillDrive
        </a>
        <button id="logout-btn" class="logout-btn">Logout</button>
      </header>

      <div class="container">
        <!-- Breadcrumb -->
        <div class="breadcrumb-bar" id="breadcrumb">
          <span>🏠</span>
          <a href="#" data-id="root">Root</a>
        </div>
        
        <!-- Toolbar -->
        <div class="toolbar">
          <input type="text" class="search-box" id="search-box" placeholder="🔍 Search files in this folder..." />
          <div class="actions">
            <button class="btn btn-copy" id="bulk-copy-btn">📄 Copy Link (<span id="sel-count-copy">0</span>)</button>
            <button class="btn btn-download" id="bulk-dl-btn">☁️ Download Selected (<span id="sel-count-dl">0</span>)</button>
          </div>
        </div>

        <!-- File List -->
        <div class="file-list">
          <div class="file-header">
            <div><input type="checkbox" class="file-checkbox" id="check-all" /></div>
            <div></div> <!-- Icon Col -->
            <div>NAME</div>
            <div>MODIFIED</div>
            <div>SIZE</div>
            <div>ACTIONS</div>
          </div>
          <div id="file-container">
            <!-- Loading indicator -->
            <div class="loader" id="loader"></div>
          </div>
          <div class="file-footer" id="file-footer">
            0 items
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const explorerScreen = document.getElementById('explorer-screen');
    const fileContainer = document.getElementById('file-container');
    const breadcrumb = document.getElementById('breadcrumb');
    const fileFooter = document.getElementById('file-footer');
    const checkAll = document.getElementById('check-all');
    
    let currentToken = localStorage.getItem('harudex_token');
    let currentFolderId = 'root';
    let folderHistory = [{ id: 'root', name: 'Root' }];
    let currentFiles = [];

    // Format bytes
    function formatBytes(bytes, decimals = 2) {
      if (!+bytes) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }
    
    // Get Icon
    function getFileIcon(isFolder, name) {
      if (isFolder) return '📁';
      const ext = name.split('.').pop().toLowerCase();
      if (['mkv', 'mp4', 'avi', 'mov'].includes(ext)) return '🎬';
      if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return '🖼️';
      if (['zip', 'rar', '7z'].includes(ext)) return '📦';
      if (['mp3', 'flac', 'wav'].includes(ext)) return '🎵';
      return '📄';
    }

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password-input').value;
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      
      const data = await response.json();
      if (data.success) {
        localStorage.setItem('harudex_token', data.token);
        currentToken = data.token;
        showExplorer();
      } else {
        alert("Incorrect password");
      }
    });

    // Handle Logout
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('harudex_token');
      currentToken = null;
      loginScreen.style.display = 'block';
      explorerScreen.style.display = 'none';
    });

    // Check auth on load
    if (currentToken) {
      showExplorer();
    }

    function showExplorer() {
      loginScreen.style.display = 'none';
      explorerScreen.style.display = 'flex';
      loadFiles(currentFolderId);
    }

    function renderBreadcrumb() {
      breadcrumb.innerHTML = '<span>🏠</span>';
      folderHistory.forEach((item, index) => {
        const a = document.createElement('a');
        a.href = '#';
        a.textContent = item.name;
        a.onclick = (e) => {
          e.preventDefault();
          // slice history
          folderHistory = folderHistory.slice(0, index + 1);
          currentFolderId = item.id;
          loadFiles(currentFolderId);
        };
        breadcrumb.appendChild(a);
        if (index < folderHistory.length - 1) {
          const sep = document.createElement('span');
          sep.textContent = ' / ';
          sep.style.color = 'var(--text-muted)';
          breadcrumb.appendChild(sep);
        }
      });
    }

    async function loadFiles(folderId) {
      currentFolderId = folderId;
      fileContainer.innerHTML = '<div class="loader"></div>';
      renderBreadcrumb();
      checkAll.checked = false;
      updateSelection();

      try {
        const res = await fetch(`/api/list?id=${folderId}`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });

        if (res.status === 401) {
          document.getElementById('logout-btn').click();
          return;
        }

        const data = await res.json();
        if (data.success) {
          currentFiles = data.files;
          renderFiles(currentFiles);
        } else {
          fileContainer.innerHTML = `<div style="padding: 20px; color: red;">Error: ${data.message}</div>`;
        }
      } catch (err) {
        fileContainer.innerHTML = `<div style="padding: 20px; color: red;">Network Error: ${err.message}</div>`;
      }
    }

    function renderFiles(files) {
      fileContainer.innerHTML = '';
      fileFooter.textContent = `${files.length} item(s)`;

      if (files.length === 0) {
        fileContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Folder is empty</div>';
        return;
      }

      files.forEach((f, idx) => {
        const row = document.createElement('div');
        row.className = 'file-item';
        
        // Checkbox
        const chkCol = document.createElement('div');
        const chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.className = 'file-checkbox row-checkbox';
        chk.dataset.id = f.id;
        chk.dataset.name = f.name;
        chk.dataset.isfolder = f.isFolder;
        chk.onchange = (e) => {
          if (e.target.checked) row.classList.add('selected');
          else row.classList.remove('selected');
          updateSelection();
        };
        chkCol.appendChild(chk);

        // Icon
        const icon = document.createElement('div');
        icon.className = 'file-icon';
        icon.textContent = getFileIcon(f.isFolder, f.name);
        
        // Name
        const nameCol = document.createElement('div');
        nameCol.className = 'name-col';
        const nameA = document.createElement('a');
        nameA.className = 'file-name';
        nameA.textContent = f.name;
        nameA.href = '#';
        
        const fileUrl = `${window.location.origin}/api/file?id=${f.id}`;

        if (f.isFolder) {
          nameA.onclick = (e) => {
            e.preventDefault();
            folderHistory.push({ id: f.id, name: f.name });
            loadFiles(f.id);
          };
        } else {
          nameA.href = fileUrl;
          nameA.target = '_blank';
        }
        nameCol.appendChild(nameA);

        // Date & Size
        const dateCol = document.createElement('div');
        dateCol.className = 'file-meta';
        dateCol.textContent = new Date(f.modifiedTime).toLocaleDateString([], {day: 'numeric', month: 'short', year:'numeric', hour:'2-digit', minute:'2-digit'});

        const sizeCol = document.createElement('div');
        sizeCol.className = 'file-meta';
        sizeCol.textContent = f.isFolder ? '-' : formatBytes(f.size);

        // Actions
        const actCol = document.createElement('div');
        actCol.className = 'act-col';
        if (!f.isFolder) {
          // Download Btn
          const dlBtn = document.createElement('button');
          dlBtn.className = 'act-btn';
          dlBtn.title = 'Download';
          dlBtn.innerHTML = '⬇️';
          dlBtn.onclick = () => window.open(fileUrl, '_blank');
          
          // Copy Btn
          const cpBtn = document.createElement('button');
          cpBtn.className = 'act-btn';
          cpBtn.title = 'Copy Link';
          cpBtn.innerHTML = '🔗';
          cpBtn.onclick = () => {
            navigator.clipboard.writeText(fileUrl);
            cpBtn.innerHTML = '✅';
            setTimeout(() => cpBtn.innerHTML = '🔗', 2000);
          };

          actCol.appendChild(dlBtn);
          actCol.appendChild(cpBtn);
        }

        row.appendChild(chkCol);
        row.appendChild(icon);
        row.appendChild(nameCol);
        row.appendChild(dateCol);
        row.appendChild(sizeCol);
        row.appendChild(actCol);
        
        fileContainer.appendChild(row);
      });
    }

    // Checkbox Logic
    checkAll.addEventListener('change', (e) => {
      const isChecked = e.target.checked;
      document.querySelectorAll('.row-checkbox').forEach(chk => {
        // Only select visible items if filtering
        if(chk.closest('.file-item').style.display !== 'none') {
          chk.checked = isChecked;
          if (isChecked) chk.closest('.file-item').classList.add('selected');
          else chk.closest('.file-item').classList.remove('selected');
        }
      });
      updateSelection();
    });

    function updateSelection() {
      const selected = document.querySelectorAll('.row-checkbox:checked');
      document.getElementById('sel-count-copy').textContent = selected.length;
      document.getElementById('sel-count-dl').textContent = selected.length;
      
      // Update checkAll state
      const visibleRows = Array.from(document.querySelectorAll('.file-item')).filter(r => r.style.display !== 'none');
      if(visibleRows.length > 0 && selected.length === visibleRows.length) {
        checkAll.checked = true;
        checkAll.indeterminate = false;
      } else if (selected.length > 0) {
        checkAll.checked = false;
        checkAll.indeterminate = true;
      } else {
        checkAll.checked = false;
        checkAll.indeterminate = false;
      }
    }

    // Search
    document.getElementById('search-box').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const items = fileContainer.querySelectorAll('.file-item');
      items.forEach(item => {
        const name = item.querySelector('.file-name').textContent.toLowerCase();
        if (name.includes(q)) {
          item.style.display = 'grid';
        } else {
          item.style.display = 'none';
          // Deselect hidden items
          const chk = item.querySelector('.row-checkbox');
          if(chk.checked) {
            chk.checked = false;
            item.classList.remove('selected');
          }
        }
      });
      updateSelection();
    });

    // Bulk Copy
    document.getElementById('bulk-copy-btn').addEventListener('click', () => {
      const selected = document.querySelectorAll('.row-checkbox:checked');
      if (selected.length === 0) return alert('No items selected');
      
      let links = [];
      selected.forEach(chk => {
        if (chk.dataset.isfolder !== "true") {
          links.push(`${window.location.origin}/api/file?id=${chk.dataset.id}`);
        }
      });

      if (links.length > 0) {
        navigator.clipboard.writeText(links.join('\n'));
        const btn = document.getElementById('bulk-copy-btn');
        const origText = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        setTimeout(() => btn.innerHTML = origText, 2000);
      } else {
        alert('No files selected (folders cannot be copied)');
      }
    });

    // Bulk Download (Open in new tabs)
    document.getElementById('bulk-dl-btn').addEventListener('click', () => {
      const selected = document.querySelectorAll('.row-checkbox:checked');
      if (selected.length === 0) return alert('No items selected');
      
      let count = 0;
      selected.forEach(chk => {
        if (chk.dataset.isfolder !== "true") {
          count++;
          // Stagger downloads to prevent browser blocking
          setTimeout(() => {
            window.open(`/api/file?id=${chk.dataset.id}`, '_blank');
          }, count * 500);
        }
      });
      
      if(count === 0) alert('No files selected (folders cannot be downloaded directly)');
    });
  </script>
</body>
</html>
